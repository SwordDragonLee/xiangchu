# CI：push/PR 到 main、dev 时跑后端构建测试 + 前端四端类型检查
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  server:
    name: 后端构建与测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: server/go.sum

      - name: 构建
        run: go build ./...

      - name: 静态检查
        run: go vet ./...

      - name: 单元测试
        run: go test ./...

  web:
    name: 前端类型检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 四个 app（admin / user-mp / chef-mp / supplier-mp）逐一类型检查；
      # 不用 pnpm -r exec：--if-present 对 exec 无效，shared 包没有 vue-tsc 会中断
      - name: 类型检查
        run: |
          pnpm --filter admin exec vue-tsc --noEmit
          pnpm --filter user-mp exec vue-tsc --noEmit
          pnpm --filter chef-mp exec vue-tsc --noEmit
          pnpm --filter supplier-mp exec vue-tsc --noEmit
